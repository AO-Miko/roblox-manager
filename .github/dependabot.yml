version: 2
updates:
  # the pinned GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    target-branch: beta
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
  # the libraries inside the Windows package (and used by the tests)
  - package-ecosystem: pip
    directory: /tools/windows
    target-branch: beta
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"
  # the Android app's libraries
  - package-ecosystem: gradle
    directory: /android
    target-branch: beta
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"
