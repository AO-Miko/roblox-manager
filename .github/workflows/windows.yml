name: Windows

# Runs the tests on a real Windows machine, and checks the Windows package of every release.
on:
  push:
    branches: [main, release, beta]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests on Windows
    runs-on: windows-latest
    timeout-minutes: 30            # a test that waits for a click or a stuck download must not run for hours
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -r tools/windows/requirements.txt
      - name: Windows specifics (folders, DPAPI, signatures, TLS)
        run: python tests/test_windows_native.py
      - name: Signature check (against OpenSSH)
        if: ${{ !cancelled() }}
        run: python tests/test_sshsig.py
      - name: Release updater
        if: ${{ !cancelled() }}
        run: python tests/test_updater_release.py
      - name: Ban list
        if: ${{ !cancelled() }}
        run: python tests/test_bans.py
      - name: Info tab
        if: ${{ !cancelled() }}
        run: python tests/test_info_tab.py
      - name: Navigation and search
        if: ${{ !cancelled() }}
        run: python tests/test_nav.py
      - name: Looks (themes, accent colours, text size)
        if: ${{ !cancelled() }}
        run: python tests/test_theme.py
      - name: Update channels
        if: ${{ !cancelled() }}
        run: python tests/test_channels.py
      - name: Forced updates
        if: ${{ !cancelled() }}
        run: python tests/test_policy.py
      - name: Start after an update
        if: ${{ !cancelled() }}
        run: python tests/test_launcher_update.py
      - name: Every call the app makes exists
        if: ${{ !cancelled() }}
        run: python tests/test_api_surface.py
      - name: Discover (games, search, play)
        if: ${{ !cancelled() }}
        run: python tests/test_discover.py
      - name: Friend alerts, requests of all groups, backup
        if: ${{ !cancelled() }}
        run: python tests/test_extras.py
      - name: Server locations and the world map
        if: ${{ !cancelled() }}
        run: python tests/test_geo.py
      - name: Mutual friends, voice and age, DevEx, game wikis
        if: ${{ !cancelled() }}
        run: python tests/test_features.py
      - name: App debug log
        if: ${{ !cancelled() }}
        run: python tests/test_debug.py
      - name: Security checks
        if: ${{ !cancelled() }}
        run: python tests/test_security.py
      - name: Version numbers
        if: ${{ !cancelled() }}
        run: python tests/test_versions.py
      - name: Updates box
        if: ${{ !cancelled() }}
        run: python tests/test_settings_updates.py
      - name: No cut-off text on any tab (Windows fonts)
        if: ${{ !cancelled() }}
        run: python tests/test_text_fit.py
      - name: The whole app against a fake Roblox
        if: ${{ !cancelled() }}
        run: python tests/test_gui_full.py
      - name: The app starts
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          python -X faulthandler linux/launcher.py --selftest
          Write-Host "exit code: $LASTEXITCODE"
          exit $LASTEXITCODE

  package:
    name: The Windows package of the release
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: windows-latest
    timeout-minutes: 30            # a test that waits for a click or a stuck download must not run for hours
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download the package
        shell: pwsh
        run: |
          $tag = if ("${{ github.event_name }}" -eq "release") { "${{ github.event.release.tag_name }}" } else { (gh release view --repo "${{ github.repository }}" --json tagName --jq .tagName) }
          Write-Host "release $tag"
          gh release download $tag --repo "${{ github.repository }}" --pattern "roblox-manager-windows-*.zip" --pattern "SHA256SUMS.txt"
          Get-ChildItem
      - name: Checksum
        shell: pwsh
        run: |
          $zip = Get-ChildItem roblox-manager-windows-*.zip | Select-Object -First 1
          $want = (Select-String -Path SHA256SUMS.txt -Pattern $zip.Name).Line.Split(" ")[0]
          $got = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLower()
          if ($want -ne $got) { throw "checksum mismatch: $want vs $got" }
          Expand-Archive $zip.FullName -DestinationPath pkg
      - name: The package starts (its own Python, no installation)
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          .\pkg\RobloxManager\python\python.exe .\pkg\RobloxManager\app\launcher.py --selftest
          if ($LASTEXITCODE -ne 0) { throw "selftest failed" }
      - name: Shortcut script
        shell: pwsh
        run: |
          $dest = (Resolve-Path .\pkg\RobloxManager).Path
          powershell -NoProfile -ExecutionPolicy Bypass -File "$dest\shortcut.ps1" -Dest $dest
          $lnk = Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\Roblox Manager.lnk"
          if (-not (Test-Path $lnk)) { throw "no shortcut was made" }
          $s = (New-Object -ComObject WScript.Shell).CreateShortcut($lnk)
          Write-Host $s.TargetPath $s.Arguments
          if (-not (Test-Path $s.TargetPath)) { throw "the shortcut points nowhere" }

  installer:
    name: The Windows installer of the release
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: windows-latest
    timeout-minutes: 30            # a test that waits for a click or a stuck download must not run for hours
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download the installer
        shell: pwsh
        run: |
          $tag = if ("${{ github.event_name }}" -eq "release") { "${{ github.event.release.tag_name }}" } else { (gh release view --repo "${{ github.repository }}" --json tagName --jq .tagName) }
          gh release download $tag --repo "${{ github.repository }}" --pattern "Roblox-Manager-Setup-*.exe" --pattern "SHA256SUMS.txt"
          $exe = Get-ChildItem Roblox-Manager-Setup-*.exe | Select-Object -First 1
          $want = (Select-String -Path SHA256SUMS.txt -Pattern $exe.Name).Line.Split(" ")[0]
          $got = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          if ($want -ne $got) { throw "checksum mismatch: $want vs $got" }
          Write-Host "$($exe.Name) $([math]::Round($exe.Length / 1MB)) MB, checksum ok"
      - name: Install with the defaults (Start menu entry, no desktop icon)
        shell: pwsh
        run: |
          $exe = (Get-ChildItem Roblox-Manager-Setup-*.exe | Select-Object -First 1).FullName
          $p = Start-Process $exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/LOG=$PWD\setup.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content setup.log -Tail 40; throw "setup exit code $($p.ExitCode)" }
          # the live details (also written to the log): folders, files with sizes, totals, shortcuts
          $log = Get-Content setup.log -Raw
          foreach ($want in "Folder created: ", "   File   ", "app\app.py", "Start menu entry created", "Registered in Settings > Apps") {
            if (-not $log.Contains($want)) { throw "the live details do not mention: $want" }
          }
          if ($log -notmatch "Done: \d+ files in \d+ folders") { throw "the live details have no total" }
          $reported = ([regex]::Matches($log, "(?m)^.*   File   ")).Count
          $dir = Join-Path $env:APPDATA "RobloxManager\App"
          $real = (Get-ChildItem $dir -Recurse -File | Where-Object { $_.Name -ne "unins000.dat" }).Count
          Write-Host "files reported: $reported, files on disk (without unins000.dat): $real"
          if ($reported -ne $real) { throw "the live details list $reported files but $real were installed" }
          foreach ($f in "python\pythonw.exe","app\launcher.py","app\app.py","site-packages\PySide6\QtCore.pyd","trust\allowed_signers","unins000.exe") {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "missing after install: $f" }
          }
          $menu = Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\Roblox Manager.lnk"
          if (-not (Test-Path $menu)) { throw "no Start menu entry" }
          $s = (New-Object -ComObject WScript.Shell).CreateShortcut($menu)
          if (-not (Test-Path $s.TargetPath)) { throw "the Start menu entry points nowhere: $($s.TargetPath)" }
          if (Test-Path (Join-Path ([Environment]::GetFolderPath("Desktop")) "Roblox Manager.lnk")) { throw "a desktop icon was made although it is optional and off by default" }
          $key = Get-ChildItem "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall" | Where-Object { $_.PSChildName -like "*B9F4E6A8-3D2C-4C57-9E3A-5D8A1F7C2E41*" }
          if (-not $key) { throw "not listed in Apps and features" }
          Write-Host "listed as:" $key.GetValue("DisplayName") $key.GetValue("DisplayVersion")
      - name: The installed app starts
        shell: pwsh
        run: |
          $dir = Join-Path $env:APPDATA "RobloxManager\App"
          $env:QT_QPA_PLATFORM = "offscreen"
          & "$dir\python\python.exe" "$dir\app\launcher.py" --selftest
          if ($LASTEXITCODE -ne 0) { throw "selftest failed" }
      - name: Uninstall (keeping the person's data)
        shell: pwsh
        run: |
          $dir = Join-Path $env:APPDATA "RobloxManager\App"
          Set-Content (Join-Path $env:APPDATA "RobloxManager\mydata.txt") "a person's own data (settings, saved accounts)"
          $p = Start-Process "$dir\unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/LOG=$PWD\uninstall.log" -Wait -PassThru
          Start-Sleep -Seconds 3
          $ulog = Get-Content uninstall.log -Raw
          foreach ($want in "   Deleted   ", "Folder deleted: ") {
            if (-not $ulog.Contains($want)) { throw "the uninstall details do not mention: $want" }
          }
          if ($ulog -notmatch "Done: \d+ files and \d+ folders deleted") { throw "the uninstall details have no total" }
          if ($ulog -match "Could not delete") { throw "the uninstaller could not delete something" }
          if (Test-Path "$dir\python") { throw "files were left behind" }
          if (Test-Path (Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\Roblox Manager.lnk")) { throw "the Start menu entry is still there" }
          if (-not (Test-Path (Join-Path $env:APPDATA "RobloxManager\mydata.txt"))) { throw "the person's data was removed although it should be kept" }
      - name: Install in a folder of choice, with the desktop icon and without the Start menu entry
        shell: pwsh
        run: |
          $exe = (Get-ChildItem Roblox-Manager-Setup-*.exe | Select-Object -First 1).FullName
          $dir = Join-Path $env:USERPROFILE "My Programs\Roblox Mgr"
          $p = Start-Process $exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=`"$dir`"","/TASKS=desktopicon" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "setup exit code $($p.ExitCode)" }
          if (-not (Test-Path "$dir\python\pythonw.exe")) { throw "not installed in the chosen folder" }
          if (Test-Path (Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\Roblox Manager.lnk")) { throw "a Start menu entry was made although it was switched off" }
          $desk = Join-Path ([Environment]::GetFolderPath("Desktop")) "Roblox Manager.lnk"
          if (-not (Test-Path $desk)) { throw "no desktop icon" }
          $env:QT_QPA_PLATFORM = "offscreen"
          & "$dir\python\python.exe" "$dir\app\launcher.py" --selftest
          if ($LASTEXITCODE -ne 0) { throw "selftest failed" }
      - name: Uninstall again, also removing the data
        shell: pwsh
        run: |
          $dir = Join-Path $env:USERPROFILE "My Programs\Roblox Mgr"
          Start-Process "$dir\unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/REMOVEDATA=yes" -Wait
          Start-Sleep -Seconds 3
          if (Test-Path "$dir\python") { throw "files were left behind" }
          if (Test-Path (Join-Path ([Environment]::GetFolderPath("Desktop")) "Roblox Manager.lnk")) { throw "the desktop icon is still there" }
          if (Test-Path (Join-Path $env:APPDATA "RobloxManager")) { throw "the data was not removed with /REMOVEDATA=yes" }
