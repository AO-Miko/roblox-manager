name: CI

# Tests for every push and pull request: the desktop app on Linux and the Android app's unit tests (Windows has its own workflow).
on:
  push:
    branches: [main, release, beta]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Code checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Python mistakes that only show when the line runs (undefined names, duplicate definitions, syntax errors)
        run: |
          pip install ruff==0.8.6
          ruff check --select E9,F63,F7,F82,F811 --output-format concise linux tests tools
      - name: Shell scripts (shellcheck is on the runner)
        run: shellcheck -S error tools/*.sh
      - name: Every JSON file in the repository is valid JSON
        run: |
          python - <<'PY'
          import json, pathlib, sys
          bad = 0
          for p in sorted(pathlib.Path(".").rglob("*.json")):
              if any(part in (".git", "node_modules", "build", ".gradle") for part in p.parts):
                  continue
              try:
                  json.loads(p.read_text(encoding="utf-8"))
              except ValueError as e:
                  print(f"{p}: {e}"); bad += 1
          sys.exit(1 if bad else 0)
          PY

  linux:
    name: Tests on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30            # a test that waits for a click or a stuck download must not run for hours
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/windows/requirements.txt
      - name: System libraries Qt needs
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1 libnss3 libxcomposite1 \
            libxdamage1 libxrandr2 libxtst6 libxcursor1 libxi6 libxss1 libasound2t64 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-shape0 libxcb-xinerama0 libxcb-image0 libxcb-render-util0
      - run: pip install -r tools/windows/requirements.txt
      - name: Git identity for the updater tests
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.invalid"
      - name: Signature check
        run: python tests/test_sshsig.py
      - name: Git updater
        run: python tests/test_updater.py
      - name: Release updater
        run: python tests/test_updater_release.py
      - name: Windows/Linux specifics
        run: python tests/test_windows_native.py
      - name: Ban list
        run: python tests/test_bans.py
      - name: Info tab
        run: python tests/test_info_tab.py
      - name: Navigation and search
        run: python tests/test_nav.py
      - name: Looks (themes, accent colours, text size)
        run: python tests/test_theme.py
      - name: No test uses the real internet
        run: python tests/test_offline.py
      - name: Terms of use and Privacy policy question
        run: python tests/test_legal.py
      - name: Notifications
        run: python tests/test_notices.py
      - name: Roles, staff list and admin page
        run: python tests/test_admin.py
      - name: Update channels
        run: python tests/test_channels.py
      - name: Forced updates
        run: python tests/test_policy.py
      - name: Start after an update
        run: python tests/test_launcher_update.py
      - name: Every call the app makes exists
        run: python tests/test_api_surface.py
      - name: Discover (games, search, play)
        run: python tests/test_discover.py
      - name: Friend alerts, requests of all groups, backup
        run: python tests/test_extras.py
      - name: Server locations and the world map
        run: python tests/test_geo.py
      - name: Mutual friends, voice and age, DevEx, game wikis
        run: python tests/test_features.py
      - name: App debug log
        run: python tests/test_debug.py
      - name: Security checks
        run: python tests/test_security.py
      - name: Version numbers
        run: python tests/test_versions.py
      - name: Updates box
        run: python tests/test_settings_updates.py
      - name: No cut-off text on any tab
        run: python tests/test_text_fit.py
      - name: No cut-off text in the light theme at the largest text size
        run: python tests/test_text_fit.py light,pink,125
      - name: The whole app against a fake Roblox
        run: python tests/test_gui_full.py
      - name: The app starts
        run: python linux/launcher.py --selftest

  android:
    name: Android unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30            # a test that waits for a click or a stuck download must not run for hours
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Unit tests
        working-directory: android
        run: ./gradlew --no-daemon --console=plain :app:testDebugUnitTest
      - name: Android lint (finds calls that need a newer Android than the app supports)
        working-directory: android
        run: ./gradlew --no-daemon --console=plain :app:lintDebug
